<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Food & Nutrition Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js library to convert Gemini Markdown to HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Table Styling for Markdown Output */
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            margin-bottom: 1rem;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid #e5e7eb;
            padding: 8px 12px;
            text-align: left;
        }
        .markdown-body th {
            background-color: #f3f4f6;
            font-weight: 600;
        }
        .markdown-body h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: #374151;
        }
        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-indigo-600 p-6 text-white text-center">
            <h1 class="text-3xl font-bold">🥗 AI Food & Nutrition Analyzer</h1>
            <p class="text-indigo-100 mt-2">Upload a food photo to get instant nutrition details!</p>
        </div>

        <div class="p-6">
            <form action="/analyze" method="post" enctype="multipart/form-data" class="space-y-4" onsubmit="showLoading()">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Upload Food Image:</label>
                    <input type="file" name="file" accept="image/*" required
                           class="block w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 border border-gray-300 rounded-lg p-2 cursor-pointer">
                </div>

                <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center">
                    🔍 Analyze Food
                </button>
            </form>

            <div id="loading" class="hidden mt-6 text-center text-indigo-600">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
                <p class="mt-2 text-sm font-medium">Gemini AI is analyzing your food image...</p>
            </div>

            {% if result %}
            <div class="mt-8 border-t pt-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">📊 Analysis Report:</h2>
                
                <!-- Raw Markdown output storage -->
                <div id="raw-result" class="hidden">{{ result }}</div>
                
                <!-- Rendered HTML Output -->
                <div id="formatted-result" class="markdown-body bg-gray-50 p-5 rounded-xl border border-gray-200 text-gray-700 leading-relaxed"></div>
            </div>
            {% endif %}
        </div>
    </div>

    <script>
        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
        }

        // Render Markdown to HTML including Tables
        document.addEventListener("DOMContentLoaded", function() {
            const rawElement = document.getElementById('raw-result');
            const targetElement = document.getElementById('formatted-result');
            if (rawElement && targetElement) {
                targetElement.innerHTML = marked.parse(rawElement.textContent);
            }
        });
    </script>
</body>
</html>
